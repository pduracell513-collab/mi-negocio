<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fashion Store — Colección Profesional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0d0d0d;
      --white: #fafaf8;
      --gray-100: #f4f3f0;
      --gray-200: #e8e6e1;
      --gray-300: #ccc9c2;
      --gray-500: #888580;
      --gray-700: #3d3b38;
      --accent: #c8a87a;
      --wa-green: #25D366;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
      --radius: 3px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--white);
      color: var(--black);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 2rem;
      height: 64px;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--black);
      text-decoration: none;
    }

    .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }

    .cart-btn {
      position: relative;
      background: none;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 7px 14px;
      font-size: 12px;
      color: var(--gray-700);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition);
    }
    
    .cart-count {
      background: var(--black);
      color: var(--white);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      display: none;
    }
    .cart-count.visible { display: inline-block; }

    .hero {
      padding: 5rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--gray-200);
      background-color: var(--gray-100);
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem;
      border-bottom: 1px solid var(--gray-200);
      overflow-x: auto;
    }
    .filter-btn {
      background: none; border: none;
      font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--gray-500);
      cursor: pointer;
    }
    .filter-btn.active { color: var(--black); font-weight: 500; border-bottom: 1px solid var(--black); }

    .products-section { padding: 4rem 2rem; }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      display: flex; flex-direction: column;
      border: 1px solid var(--gray-200);
      transition: transform var(--transition);
      background: white;
    }
    .product-card:hover { transform: translateY(-5px); }

    .product-thumb {
      aspect-ratio: 1/1;
      overflow: hidden;
      background: var(--gray-100);
    }
    .product-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .product-info { padding: 1.5rem; text-align: center; flex-grow: 1; }
    .product-price { font-family: var(--font-display); font-size: 22px; margin: 10px 0; }

    .btn-action {
      width: 100%; padding: 12px;
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.1em; cursor: pointer;
      border-radius: var(--radius); transition: all var(--transition);
      margin-top: 8px;
    }
    .btn-primary { background: var(--black); color: white; border: 1px solid var(--black); }
    .btn-secondary { background: transparent; color: var(--black); border: 1px solid var(--gray-300); }

    .info-section { padding: 5rem 2rem; text-align: center; border-top: 1px solid var(--gray-200); }
    .map-container { max-width: 900px; margin: 0 auto 2rem; border-radius: 8px; overflow: hidden; border: 1px solid var(--gray-200); }

    .wa-float {
      position: fixed; bottom: 30px; right: 30px;
      background: var(--wa-green);
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    /* CARRITO LATERAL */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100vw);
      background: white; z-index: 201; transform: translateX(100%);
      transition: transform 0.3s ease; display: flex; flex-direction: column;
    }
    .cart-drawer.open { transform: translateX(0); }
    .drawer-header { padding: 20px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; }
    .drawer-body { flex-grow: 1; overflow-y: auto; padding: 20px; }
    .drawer-footer { padding: 20px; border-top: 1px solid var(--gray-200); }

    @media (max-width: 640px) {
      header { padding: 0 1rem; }
      .products-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div></div>
    <a href="#" class="logo">Fashion Store</a>
    <div class="header-right">
      <button class="cart-btn" onclick="toggleDrawer()">
        Pedido <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <h1 style="font-family: var(--font-display); font-size: 48px; font-weight: 300;">D'Michel</h1>
    <p>Calidad y tendencia en cada prenda</p>
  </section>

  <nav class="filters">
    <button class="filter-btn active" onclick="filtrar('todos', this)">Todos</button>
    <button class="filter-btn" onclick="filtrar('tops', this)">Tops</button>
    <button class="filter-btn" onclick="filtrar('conjuntos', this)">Conjuntos</button>
    <button class="filter-btn" onclick="filtrar('vestidos', this)">Vestidos</button>
  </nav>

  <main class="products-section">
    <div class="products-grid" id="products-grid"></div>
  </main>

  <section class="info-section">
    <h2 style="font-family: var(--font-display); margin-bottom: 2rem;">Ubicación</h2>
    <div class="map-container">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3826.657474441223!2d-95.1951557!3d16.1887309!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTbCsDExJzE5LjQiTiA5NcKwMTEnNDIuNiJX!5e0!3m2!1ses!2smx!4v1715000000000" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>
    <a href="https://www.google.com/maps?q=16.1887309,-95.1951557" target="_blank" class="btn-secondary" style="padding: 12px 25px; text-decoration: none; border-radius: 50px;">¿Cómo llegar con GPS?</a>
  </section>

  <section class="info-section" style="background: var(--gray-100);">
    <h2 style="font-family: var(--font-display);">Síguenos</h2>
    <div style="margin-top: 1rem;">
      <a href="https://facebook.com/TU_NEGOCIO" target="_blank" style="text-decoration: none; color: black; margin: 0 10px;">Facebook</a> |
      <a href="https://instagram.com/TU_NEGOCIO" target="_blank" style="text-decoration: none; color: black; margin: 0 10px;">Instagram</a>
    </div>
  </section>

  <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="drawer-header">
      <span style="font-family: var(--font-display); font-size: 20px;">Mi Carrito</span>
      <button onclick="toggleDrawer()" style="background:none; border:none; font-size: 20px; cursor:pointer;">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      </div>
    <div class="drawer-footer">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">
        <span>Total:</span>
        <span id="cart-total">$0</span>
      </div>
      <button class="btn-action btn-primary" style="background: var(--wa-green); border: none;" onclick="enviarPedido()">Finalizar pedido por WhatsApp</button>
    </div>
  </aside>

  <a href="https://wa.me/5219711411208" class="wa-float" target="_blank">
    <svg width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
  </a>

  <script>
    const WA_NUMBER = "5219711411208";
    // Base de URL de tu sitio para los links de imágenes (ajusta si es necesario)
    const BASE_URL = "https://pduracell513-collab.github.io/mi-negocio/";

    const PRODUCTOS = [
      { id: 1, nombre: "Top Tres Colores", precio: 220, info: "Crema, amarillo y verde menta", imagen: "imagenes/top-trescolores.jpeg", cat: "tops" },
      { id: 2, nombre: "Lencería Elegante", precio: 340, info: "Conjunto cómodo y sofisticado", imagen: "imagenes/lenceria.jpeg", cat: "conjuntos" },
      { id: 3, nombre: "Conjunto Top y Falda", precio: 400, info: "Moderno, ideal para uso casual", imagen: "imagenes/conjunto-top-y-falda.jpeg", cat: "conjuntos" },
      { id: 4, nombre: "Top con Botones", precio: 220, info: "Casual para uso diario", imagen: "imagenes/top-con-botones.jpeg", cat: "tops" },
      { id: 5, nombre: "Top Verde Petróleo", precio: 180, info: "Elegancia en color único", imagen: "imagenes/top-verde-petroleo.jpeg", cat: "tops" },
      { id: 6, nombre: "Conjunto ALO Rojo", precio: 360, info: "Marca ALO, estilo deportivo/casual", imagen: "imagenes/conjunto-rojo.jpeg", cat: "conjuntos" },
      { id: 7, nombre: "Vestido Verde", precio: 450, info: "Ideal para ocasiones especiales", imagen: "imagenes/vestido-converde.jpeg", cat: "vestidos" },
      { id: 8, nombre: "Vestido Negro", precio: 450, info: "Un clásico infaltable", imagen: "imagenes/vestido-connegro.jpeg", cat: "vestidos" },
      { id: 9, nombre: "Conjunto Blanco", precio: 450, info: "Elegancia pura", imagen: "imagenes/conjunto-blanco.jpeg", cat: "conjuntos" },
      { id: 10, nombre: "Vestido Rojo", precio: 320, info: "Llamativo y elegante", imagen: "imagenes/vestido-rojo.jpeg", cat: "vestidos" }
    ];

    let carrito = [];

    function renderProducts(lista) {
      const grid = document.getElementById("products-grid");
      grid.innerHTML = "";
      lista.forEach(p => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <div class="product-thumb"><img src="${p.imagen}" alt="${p.nombre}"></div>
          <div class="product-info">
            <h3 style="font-size:14px; font-weight:400;">${p.nombre}</h3>
            <p style="font-size:11px; color:var(--gray-500);">${p.info}</p>
            <div class="product-price">$${p.precio}</div>
            <button class="btn-action btn-primary" onclick="agregarAlCarrito(${p.id})">Agregar al pedido</button>
            <button class="btn-action btn-secondary" onclick="pedirDirecto(${p.id})">Pedir ahora</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filtrar(cat, btn) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const lista = cat === 'todos' ? PRODUCTOS : PRODUCTOS.filter(p => p.cat === cat);
      renderProducts(lista);
    }

    function agregarAlCarrito(id) {
      const p = PRODUCTOS.find(x => x.id === id);
      const itemEnCarrito = carrito.find(x => x.id === id);
      
      if (itemEnCarrito) {
        itemEnCarrito.qty++;
      } else {
        carrito.push({ ...p, qty: 1 });
      }
      
      actualizarInterfaz();
      // Opcional: abrir el carrito automáticamente al agregar
      // toggleDrawer(); 
    }

    function actualizarInterfaz() {
      // Actualizar contador del header
      const totalItems = carrito.reduce((sum, item) => sum + item.qty, 0);
      const countBadge = document.getElementById("cart-count");
      countBadge.textContent = totalItems;
      countBadge.classList.toggle("visible", totalItems > 0);
      
      renderDrawer();
    }

    function renderDrawer() {
      const body = document.getElementById("drawer-body");
      const totalEl = document.getElementById("cart-total");
      let total = 0;

      if (carrito.length === 0) {
        body.innerHTML = "<p style='text-align:center; color:gray; margin-top:20px;'>Tu carrito está vacío</p>";
      } else {
        body.innerHTML = carrito.map(item => {
          total += item.precio * item.qty;
          return `
            <div style="display:flex; gap:10px; margin-bottom:20px; align-items:center; border-bottom: 1px solid #f0f0f0; padding-bottom:10px;">
              <img src="${item.imagen}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">
              <div style="flex-grow:1;">
                <div style="font-size:13px; font-weight:500;">${item.nombre}</div>
                <div style="font-size:11px; color:gray;">$${item.precio} x ${item.qty}</div>
              </div>
              <button onclick="quitarDelCarrito(${item.id})" style="background:none; border:none; color:red; cursor:pointer;">✕</button>
            </div>
          `;
        }).join("");
      }
      totalEl.textContent = `$${total}`;
    }

    function quitarDelCarrito(id) {
      carrito = carrito.filter(item => item.id !== id);
      actualizarInterfaz();
    }

    function toggleDrawer() {
      const drawer = document.getElementById("cart-drawer");
      const overlay = document.getElementById("drawer-overlay");
      const isOpen = drawer.classList.toggle("open");
      overlay.style.display = isOpen ? "block" : "none";
    }

    // FUNCIÓN: PEDIR AHORA (Directo desde la tarjeta)
    function pedirDirecto(id) {
      const p = PRODUCTOS.find(x => x.id === id);
      const imgLink = BASE_URL + p.imagen;
      const mensaje = encodeURIComponent(
        `Hola, me interesa comprar este producto:\n\n` +
        `🛍️ *${p.nombre}*\n` +
        `💰 Precio: $${p.precio}\n` +
        `🖼️ Ver imagen: ${imgLink}`
      );
      window.open(`https://wa.me/${WA_NUMBER}?text=${mensaje}`, "_blank");
    }

    // FUNCIÓN: ENVIAR TODO EL CARRITO
    function enviarPedido() {
      if (carrito.length === 0) return;
      
      let mensajeTexto = "¡Hola! Quiero realizar el siguiente pedido:\n\n";
      let total = 0;

      carrito.forEach(item => {
        const subtotal = item.precio * item.qty;
        total += subtotal;
        const imgLink = BASE_URL + item.imagen;
        mensajeTexto += `✅ *${item.nombre}* (x${item.qty})\n`;
        mensajeTexto += `   Subtotal: $${subtotal}\n`;
        mensajeTexto += `   Ref: ${imgLink}\n\n`;
      });

      mensajeTexto += `*Total a pagar: $${total}*`;
      
      window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(mensajeTexto)}`, "_blank");
    }

    // Carga inicial
    renderProducts(PRODUCTOS);
  </script>
</body>
</html>
